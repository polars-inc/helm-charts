{{- if .Values.runtime.composed.enabled }}
  {{- $workerRequirements := include "polars.worker.requirements" . }}
  {{- if or .Values.runtime.composed.requirements $workerRequirements }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polars.fullname" . }}-requirements-txt
  labels:
    {{- include "polars.labels" . | nindent 4 }}
data:
    {{- with .Values.runtime.composed.requirements }}
  requirementsTxt: {{ . | quote }}
    {{- end }}
    {{- with $workerRequirements }}
  workerRequirementsTxt: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
