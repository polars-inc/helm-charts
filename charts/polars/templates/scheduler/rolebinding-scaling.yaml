{{- if and (include "polars.isAutoscalingEnabled" .) .Values.scaling.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "polars.scaling.rbacName" . }}
  labels:
    {{ include "polars.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "polars.scaling.rbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "polars.scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
